name: nigson-local
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: nigson_bootstrap
      POSTGRES_PASSWORD: mock-local-bootstrap
      POSTGRES_DB: nigson
    ports:
      - "127.0.0.1:${NIGSON_DB_PORT:-5432}:5432"
    volumes:
      - nigson-postgres:/var/lib/postgresql
      - ./infrastructure/docker/postgres/10-local-bootstrap.sql:/docker-entrypoint-initdb.d/10-local-bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nigson_bootstrap", "-d", "nigson"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mock-local-identity-db
      POSTGRES_DB: keycloak
    volumes:
      - nigson-identity:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mock-local-identity-db
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-local-bootstrap}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-mock-local-identity-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infrastructure/docker/keycloak/nigson-local-realm.json:/opt/keycloak/data/import/nigson-local-realm.json:ro
      - ./infrastructure/docker/keycloak/themes/nigson:/opt/keycloak/themes/nigson:ro
    depends_on:
      identity-db:
        condition: service_healthy
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICES: kms,sns,sqs,s3,ses
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "1"
      LOCALSTACK_HOST: localstack:4566
      DISABLE_EVENTS: "1"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - nigson-localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    environment:
      APP_ENV: ${APP_ENV:-local}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - nigson-mailpit:/data

  vector-db:
    profiles: [ai]
    image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: nigson_bootstrap
      POSTGRES_PASSWORD: mock-local-bootstrap
      POSTGRES_DB: nigson_vector_test
    volumes:
      - nigson-vector:/var/lib/postgresql
      - ./infrastructure/docker/postgres/10-local-bootstrap.sql:/docker-entrypoint-initdb.d/10-local-bootstrap.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, nigson_bootstrap, -d, nigson_vector_test]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate-commerce:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: commerce
      MIGRATION_RELEASE: ${SCHEMA_RELEASE:-BP1}
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${COMMERCE_MIGRATION_PASSWORD:?Missing COMMERCE_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  commerce:
    profiles: [app]
    image: nigson/commerce:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: application
    environment:
      NIGSON_EVENTS_ENABLED: "true"
      NIGSON_EVENT_ENDPOINT: http://localstack:4566
      NIGSON_EVENT_TOPIC: arn:aws:sns:us-east-1:000000000000:nigson-local-domain-events
      NIGSON_EVENT_QUEUE: http://localstack:4566/queue/us-east-1/000000000000/commerce-domain
      NIGSON_EVENT_DLQ: http://localstack:4566/queue/us-east-1/000000000000/commerce-domain-dlq
      SCHEMA_RELEASE: ${SCHEMA_RELEASE:-BP1}
      APP_ENV: ${APP_ENV:-local}
      NIGSON_SECURITY_ENABLED: ${NIGSON_SECURITY_ENABLED:-false}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=commerce
      NIGSON_PROVIDERS_ENABLED: ${NIGSON_PROVIDERS_ENABLED:-false}
      NIGSON_CARRIER_QUOTES_ENABLED: ${NIGSON_CARRIER_QUOTES_ENABLED:-false}
      NIGSON_CARRIER_PROVIDER: ${NIGSON_CARRIER_PROVIDER:-PANDAGO}
      NIGSON_CARRIER_ACCOUNT_FINGERPRINT: ${NIGSON_CARRIER_ACCOUNT_FINGERPRINT:-}
      NIGSON_FULFILLMENT_ENABLED: ${NIGSON_FULFILLMENT_ENABLED:-false}
      NIGSON_FULFILLMENT_MODE: ${NIGSON_FULFILLMENT_MODE:-}
      NIGSON_FULFILLMENT_APPROVAL: ${NIGSON_FULFILLMENT_APPROVAL:-}
      NIGSON_FULFILLMENT_APPROVAL_UNTIL: ${NIGSON_FULFILLMENT_APPROVAL_UNTIL:-}
      PAYSTACK_MODE: ${PAYSTACK_MODE:-LIVE}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      NIGSON_DB_USER: nigson_commerce_app
      NIGSON_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?Missing COMMERCE_DB_PASSWORD}
      # Public issuer is browser/token identity; Commerce uses the private JWKS
      # endpoint below for backchannel traffic from inside the Compose network.
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      NIGSON_BFF_CLIENT_SECRET: ${NIGSON_BFF_CLIENT_SECRET:-mock-bff-local-confidential-secret-32-bytes}
      NIGSON_REGISTRATION_ENABLED: ${NIGSON_REGISTRATION_ENABLED:-true}
      NIGSON_REGISTRATION_CLIENT_ID: ${NIGSON_REGISTRATION_CLIENT_ID:-nigson-registration}
      NIGSON_REGISTRATION_CLIENT_SECRET: ${NIGSON_REGISTRATION_CLIENT_SECRET:-mock-registration-local-secret-32-bytes}
      NIGSON_BFF_ALLOWED_ORIGINS: ${NIGSON_BFF_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:4200}
      NIGSON_BFF_CALLBACK: ${NIGSON_BFF_CALLBACK:-http://localhost:4200/bff/callback}
      NIGSON_BFF_RETURN_PATHS: ${NIGSON_BFF_RETURN_PATHS:-/,/account,/shop,/checkout,/admin}
      NIGSON_QUOTES_ENABLED: ${NIGSON_QUOTES_ENABLED:-false}
      NIGSON_EXPERIENCE_BASE_URL: ${NIGSON_EXPERIENCE_BASE_URL:-http://experience:8082}
      NIGSON_INTEGRATION_BASE_URL: ${NIGSON_INTEGRATION_BASE_URL:-http://integration:8083}
      NIGSON_COMMERCE_WORKLOAD_SECRET: ${NIGSON_COMMERCE_WORKLOAD_SECRET-mock-commerce-local-workload-secret-32-bytes}
      NIGSON_PRODUCT_PHASE: ${NIGSON_PRODUCT_PHASE:-1}
      NIGSON_PRICING_DISTRIBUTOR_ENTITLEMENT: ${NIGSON_PRICING_DISTRIBUTOR_ENTITLEMENT:-}
      # Local-only synthetic selling fixture. Ignored unless APP_ENV=local.
      NIGSON_LOCAL_SYNTHETIC_SELLING: ${NIGSON_LOCAL_SYNTHETIC_SELLING:-false}
      NIGSON_PRIVATE_PEER_CIDRS: ${NIGSON_PRIVATE_PEER_CIDRS:-}
      NIGSON_AWS_REGION: ${NIGSON_AWS_REGION:-us-east-1}
      NIGSON_KMS_LOCAL_ENDPOINT: ${NIGSON_KMS_LOCAL_ENDPOINT:-http://localstack:4566}
      NIGSON_SESSION_KEY_REVISION: ${NIGSON_SESSION_KEY_REVISION:-}
      NIGSON_SESSION_KMS_KEY: ${NIGSON_SESSION_KMS_KEY:-}
      NIGSON_SESSION_WRAPPED_KEY: ${NIGSON_SESSION_WRAPPED_KEY:-}
      NIGSON_SESSION_PREVIOUS_WRAPPED_KEYS: ${NIGSON_SESSION_PREVIOUS_WRAPPED_KEYS:-{}}
      NIGSON_SESSION_LOCAL_KEY: ${NIGSON_SESSION_LOCAL_KEY:-}
      NIGSON_ACTOR_KMS_KEY: ${NIGSON_ACTOR_KMS_KEY:-}
      NIGSON_ACTOR_KEY_ID: ${NIGSON_ACTOR_KEY_ID:-}
      NIGSON_ACTOR_PUBLIC_KEY: ${NIGSON_ACTOR_PUBLIC_KEY:-}
      NIGSON_ACTOR_PUBLIC_KEYS: ${NIGSON_ACTOR_PUBLIC_KEYS:-}
      NIGSON_INSECURE_LOCAL_COOKIE: "true"
      SERVER_PORT: 8081
    ports:
      - "127.0.0.1:${COMMERCE_PORT:-8081}:8081"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-commerce:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-experience:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: experience
      MIGRATION_RELEASE: ${SCHEMA_RELEASE:-BP1}
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${EXPERIENCE_MIGRATION_PASSWORD:?Missing EXPERIENCE_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  experience:
    profiles: [app]
    image: nigson/experience:local
    build:
      context: .
      dockerfile: services/experience/Dockerfile
      target: application
    environment:
      NIGSON_EVENTS_ENABLED: "true"
      NIGSON_EVENT_ENDPOINT: http://localstack:4566
      NIGSON_EVENT_TOPIC: arn:aws:sns:us-east-1:000000000000:nigson-local-domain-events
      NIGSON_EVENT_QUEUE: http://localstack:4566/queue/us-east-1/000000000000/experience-projections
      NIGSON_EVENT_DLQ: http://localstack:4566/queue/us-east-1/000000000000/experience-projections-dlq
      SCHEMA_RELEASE: ${SCHEMA_RELEASE:-BP1}
      APP_ENV: ${APP_ENV:-local}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=experience
      NIGSON_SECURITY_ENABLED: ${NIGSON_SECURITY_ENABLED:-false}
      NIGSON_PRODUCT_PHASE: ${NIGSON_PRODUCT_PHASE:-1}
      NIGSON_PRIVATE_PEER_CIDRS: ${NIGSON_PRIVATE_PEER_CIDRS:-}
      NIGSON_ACTOR_PUBLIC_KEYS: ${NIGSON_ACTOR_PUBLIC_KEYS:-}
      NIGSON_CONTENT_MARKET_CODES: ${NIGSON_CONTENT_MARKET_CODES:-NG}
      NIGSON_CONTENT_ALLOWED_HOSTS: ${NIGSON_CONTENT_ALLOWED_HOSTS:-localhost,nigson.com}
      NIGSON_DISTRIBUTOR_REQUIRED_DOCUMENT_TYPES: ${NIGSON_DISTRIBUTOR_REQUIRED_DOCUMENT_TYPES:-}
      NIGSON_DISTRIBUTOR_RECIPIENT_GROUP: ${NIGSON_DISTRIBUTOR_RECIPIENT_GROUP:-}
      NIGSON_DISTRIBUTOR_COMMERCE_MODE: ${NIGSON_DISTRIBUTOR_COMMERCE_MODE:-}
      NIGSON_LEAD_RECIPIENT_GROUP: ${NIGSON_LEAD_RECIPIENT_GROUP:-}
      NIGSON_LEADS_ANTISPAM_MODE: ${NIGSON_LEADS_ANTISPAM_MODE:-}
      NIGSON_LEADS_RECAPTCHA_SECRET: ${NIGSON_LEADS_RECAPTCHA_SECRET:-}
      NIGSON_LEADS_RECAPTCHA_HOSTNAMES: ${NIGSON_LEADS_RECAPTCHA_HOSTNAMES:-}
      NIGSON_LEADS_RECAPTCHA_ACTION: ${NIGSON_LEADS_RECAPTCHA_ACTION:-lead_submit}
      NIGSON_LEADS_RECAPTCHA_MIN_SCORE: ${NIGSON_LEADS_RECAPTCHA_MIN_SCORE:-0.5}
      NIGSON_LEADS_RATE_LIMIT_MODE: ${NIGSON_LEADS_RATE_LIMIT_MODE:-}
      NIGSON_LEADS_RATE_LIMIT_PER_MINUTE: ${NIGSON_LEADS_RATE_LIMIT_PER_MINUTE:-10}
      NIGSON_LEADS_RATE_LIMIT_HMAC_KEY: ${NIGSON_LEADS_RATE_LIMIT_HMAC_KEY:-}
      NIGSON_LEADS_TRUSTED_PROXY_CIDRS: ${NIGSON_LEADS_TRUSTED_PROXY_CIDRS:-}
      NIGSON_QUOTE_CATALOGUE_MODE: ${NIGSON_QUOTE_CATALOGUE_MODE:-}
      NIGSON_QUOTE_CATALOGUE_WORKLOAD_CLIENT_ID: ${NIGSON_QUOTE_CATALOGUE_WORKLOAD_CLIENT_ID:-nigson-experience}
      NIGSON_QUOTE_CATALOGUE_WORKLOAD_CLIENT_SECRET: ${NIGSON_EXPERIENCE_WORKLOAD_SECRET:-mock-experience-local-workload-secret-32-bytes}
      NIGSON_COMMERCE_PRIVATE_URL: ${NIGSON_COMMERCE_PRIVATE_URL:-http://commerce:8081}
      NIGSON_DISTRIBUTOR_WORKLOAD_CLIENT_ID: nigson-experience
      NIGSON_DISTRIBUTOR_WORKLOAD_CLIENT_SECRET: ${NIGSON_EXPERIENCE_WORKLOAD_SECRET:-mock-experience-local-workload-secret-32-bytes}
      NIGSON_DB_USER: nigson_experience_app
      NIGSON_DB_PASSWORD: ${EXPERIENCE_DB_PASSWORD:?Missing EXPERIENCE_DB_PASSWORD}
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      SERVER_PORT: 8082
    ports:
      - "127.0.0.1:${EXPERIENCE_PORT:-8082}:8082"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-experience:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-integration:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: integration
      MIGRATION_RELEASE: ${SCHEMA_RELEASE:-BP1}
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${INTEGRATION_MIGRATION_PASSWORD:?Missing INTEGRATION_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  integration:
    profiles: [app]
    image: nigson/integration:local
    build:
      context: .
      dockerfile: services/integration/Dockerfile
      target: application
    environment:
      NIGSON_GEOCODING_PROVIDER: ${NIGSON_GEOCODING_PROVIDER:-}
      GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-${GOOGLE_MAP_API_KEY:-}}
      NIGSON_EVENTS_ENABLED: "true"
      NIGSON_EVENT_ENDPOINT: http://localstack:4566
      NIGSON_EVENT_TOPIC: arn:aws:sns:us-east-1:000000000000:nigson-local-domain-events
      NIGSON_EVENT_QUEUE: http://localstack:4566/queue/us-east-1/000000000000/integration-work
      NIGSON_EVENT_DLQ: http://localstack:4566/queue/us-east-1/000000000000/integration-work-dlq
      SCHEMA_RELEASE: ${SCHEMA_RELEASE:-BP1}
      APP_ENV: ${APP_ENV:-local}
      NIGSON_SECURITY_ENABLED: ${NIGSON_SECURITY_ENABLED:-false}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=integration
      NIGSON_PROVIDERS_ENABLED: ${NIGSON_PROVIDERS_ENABLED:-false}
      NIGSON_PRODUCT_PHASE: ${NIGSON_PRODUCT_PHASE:-1}
      NIGSON_PRIVATE_PEER_CIDRS: ${NIGSON_PRIVATE_PEER_CIDRS:-}
      NIGSON_ACTOR_PUBLIC_KEYS: ${NIGSON_ACTOR_PUBLIC_KEYS:-}
      NIGSON_MESSAGING_PROVIDER: ${NIGSON_MESSAGING_PROVIDER:-TERMII}
      NIGSON_TERMII_ENABLED: ${NIGSON_TERMII_ENABLED:-false}
      TERMII_MODE: ${TERMII_MODE:-LIVE}
      TERMII_BASE_URL: ${TERMII_BASE_URL:-https://api.ng.termii.com}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-UNSET}
      NIGSON_PROVIDER_JOBS_ENABLED: ${NIGSON_PROVIDER_JOBS_ENABLED:-false}
      NIGSON_SHEETS_MODE: ${NIGSON_SHEETS_MODE:-}
      NIGSON_CAREER_SHEET_RECIPIENT_GROUP: ${NIGSON_CAREER_SHEET_RECIPIENT_GROUP:-}
      NIGSON_CAREER_SHEET_SPREADSHEET_KEY: ${NIGSON_CAREER_SHEET_SPREADSHEET_KEY:-}
      NIGSON_CAREER_SHEET_TAB: ${NIGSON_CAREER_SHEET_TAB:-}
      NIGSON_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${NIGSON_GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      NIGSON_GOOGLE_PRIVATE_KEY_PKCS8_BASE64: ${NIGSON_GOOGLE_PRIVATE_KEY_PKCS8_BASE64:-}
      NIGSON_CAREER_SHEETS_ROW_HASH_KEY_BASE64: ${NIGSON_CAREER_SHEETS_ROW_HASH_KEY_BASE64:-}
      TWILIO_MODE: ${TWILIO_MODE:-LIVE}
      TWILIO_BASE_URL: ${TWILIO_BASE_URL:-https://api.twilio.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      EMAIL_MODE: ${EMAIL_MODE:-LIVE}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NIGSON_DB_USER: nigson_integration_app
      NIGSON_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      SERVER_PORT: 8083
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-8083}:8083"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-integration:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-ai:
    profiles: [ai]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: ai
      MIGRATION_RELEASE: ${SCHEMA_RELEASE:-BP1}
      MIGRATION_JDBC_URL: jdbc:postgresql://vector-db:5432/nigson_vector_test
      MIGRATION_PASSWORD: ${AI_MIGRATION_PASSWORD:?Missing AI_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      vector-db:
        condition: service_healthy
  ai:
    profiles: [ai]
    image: nigson/ai:local
    build:
      context: services/ai
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      NIGSON_AI_PROVIDER_MODE: ${NIGSON_AI_PROVIDER_MODE:-BEDROCK}
      NIGSON_AI_BEDROCK_REGION: ${NIGSON_AI_BEDROCK_REGION:-}
      NIGSON_AI_APPROVED_BEDROCK_MODELS: ${NIGSON_AI_APPROVED_BEDROCK_MODELS:-}
      NIGSON_AI_RATE_APPROVAL_REFERENCES: ${NIGSON_AI_RATE_APPROVAL_REFERENCES:-}
      NIGSON_DB_HOST: vector-db
      NIGSON_DB_NAME: nigson_vector_test
      NIGSON_DB_PASSWORD: ${AI_DB_PASSWORD:?Missing AI_DB_PASSWORD}
    ports:
      - "127.0.0.1:${AI_PORT:-8084}:8084"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-ai:
        condition: service_completed_successfully

volumes:
  nigson-postgres:
  nigson-identity:
  nigson-localstack:
  nigson-mailpit:
  nigson-vector:
