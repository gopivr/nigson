name: nigson-local
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: nigson_bootstrap
      POSTGRES_PASSWORD: mock-local-bootstrap
      POSTGRES_DB: nigson
    ports:
      - "127.0.0.1:${NIGSON_DB_PORT:-5432}:5432"
    volumes:
      - nigson-postgres:/var/lib/postgresql
      - ./infrastructure/docker/postgres/10-local-bootstrap.sql:/docker-entrypoint-initdb.d/10-local-bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nigson_bootstrap", "-d", "nigson"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mock-local-identity-db
      POSTGRES_DB: keycloak
    volumes:
      - nigson-identity:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mock-local-identity-db
      KC_BOOTSTRAP_ADMIN_USERNAME: local-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: mock-local-identity-admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infrastructure/docker/keycloak/nigson-local-realm.json:/opt/keycloak/data/import/nigson-local-realm.json:ro
    depends_on:
      identity-db:
        condition: service_healthy
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      APP_ENV: ${APP_ENV:-local}
      SERVICES: sns,sqs,s3,ses
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "1"
      LOCALSTACK_HOST: localstack:4566
      DISABLE_EVENTS: "1"
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - nigson-localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    environment:
      APP_ENV: ${APP_ENV:-local}
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - nigson-mailpit:/data

  vector-db:
    profiles: [ai]
    image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_USER: nigson_bootstrap
      POSTGRES_PASSWORD: mock-local-bootstrap
      POSTGRES_DB: nigson_vector_test
    volumes:
      - nigson-vector:/var/lib/postgresql
      - ./infrastructure/docker/postgres/10-local-bootstrap.sql:/docker-entrypoint-initdb.d/10-local-bootstrap.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, nigson_bootstrap, -d, nigson_vector_test]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate-commerce:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: commerce
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${COMMERCE_MIGRATION_PASSWORD:?Missing COMMERCE_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  commerce:
    profiles: [app]
    image: nigson/commerce:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: application
    environment:
      APP_ENV: ${APP_ENV:-local}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=commerce
      NIGSON_DB_USER: nigson_commerce_app
      NIGSON_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?Missing COMMERCE_DB_PASSWORD}
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      SERVER_PORT: 8081
    ports:
      - "127.0.0.1:${COMMERCE_PORT:-8081}:8081"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-commerce:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-experience:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: experience
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${EXPERIENCE_MIGRATION_PASSWORD:?Missing EXPERIENCE_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  experience:
    profiles: [app]
    image: nigson/experience:local
    build:
      context: .
      dockerfile: services/experience/Dockerfile
      target: application
    environment:
      APP_ENV: ${APP_ENV:-local}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=experience
      NIGSON_DB_USER: nigson_experience_app
      NIGSON_DB_PASSWORD: ${EXPERIENCE_DB_PASSWORD:?Missing EXPERIENCE_DB_PASSWORD}
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      SERVER_PORT: 8082
    ports:
      - "127.0.0.1:${EXPERIENCE_PORT:-8082}:8082"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-experience:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-integration:
    profiles: [app]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: integration
      MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/nigson
      MIGRATION_PASSWORD: ${INTEGRATION_MIGRATION_PASSWORD:?Missing INTEGRATION_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  integration:
    profiles: [app]
    image: nigson/integration:local
    build:
      context: .
      dockerfile: services/integration/Dockerfile
      target: application
    environment:
      APP_ENV: ${APP_ENV:-local}
      NIGSON_JDBC_URL: jdbc:postgresql://postgres:5432/nigson?currentSchema=integration
      NIGSON_DB_USER: nigson_integration_app
      NIGSON_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}
      NIGSON_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/nigson-local
      NIGSON_OIDC_JWKS: http://keycloak:8080/realms/nigson-local/protocol/openid-connect/certs
      SERVER_PORT: 8083
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-8083}:8083"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-integration:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
  migrate-ai:
    profiles: [ai]
    image: nigson/migration:local
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
      target: migration
    environment:
      APP_ENV: ${APP_ENV:-local}
      MIGRATION_OWNER: ai
      MIGRATION_JDBC_URL: jdbc:postgresql://vector-db:5432/nigson_vector_test
      MIGRATION_PASSWORD: ${AI_MIGRATION_PASSWORD:?Missing AI_MIGRATION_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      vector-db:
        condition: service_healthy
  ai:
    profiles: [ai]
    image: nigson/ai:local
    build:
      context: services/ai
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      NIGSON_DB_HOST: vector-db
      NIGSON_DB_NAME: nigson_vector_test
      NIGSON_DB_PASSWORD: ${AI_DB_PASSWORD:?Missing AI_DB_PASSWORD}
    ports:
      - "127.0.0.1:${AI_PORT:-8084}:8084"
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 35s
    depends_on:
      migrate-ai:
        condition: service_completed_successfully

volumes:
  nigson-postgres:
  nigson-identity:
  nigson-localstack:
  nigson-mailpit:
  nigson-vector:
