[project]
name = "nigson-ai"
version = "0.1.0"
description = "Nigson BP5 bounded AI service; dependency foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.12",
    "boto3==1.43.108",
    "psycopg[binary,pool]==3.3.6",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "hatchling==1.32.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigson_ai"]

[tool.uv]
required-version = "==0.9.3"

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
