spring:
  application:
    name: nigson-experience
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: false
  datasource:
    url: ${NIGSON_JDBC_URL}
    username: ${NIGSON_DB_USER}
    password: ${NIGSON_DB_PASSWORD}
    hikari:
      pool-name: nigson-experience
      maximum-pool-size: 5
      connection-timeout: 2000
  main:
    banner-mode: off
server:
  shutdown: graceful
management:
  otlp:
    metrics:
      export:
        enabled: ${NIGSON_METRICS_EXPORT_ENABLED:false}
        url: ${NIGSON_OTLP_METRICS_URL:http://127.0.0.1:4318/v1/metrics}
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,ownerSchema
