spring:
  application:
    name: nigson-commerce
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: false
  datasource:
    url: ${NIGSON_JDBC_URL}
    username: ${NIGSON_DB_USER}
    password: ${NIGSON_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
  session:
    jdbc:
      initialize-schema: never
      table-name: commerce.spring_session
  main:
    banner-mode: off
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,ownerSchema
