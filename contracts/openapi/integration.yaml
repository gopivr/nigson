        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CarrierQuoteDTO"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "no-store"
                }
              },
              "X-Nigson-Carrier-Mode": {
                "description": "Actual adapter configuration; TEST transport maps to SANDBOX. Source must match its approved mode before binding a fee.",
                "schema": {
                  "type": "string",
                  "enum": [
                    "MOCK",
                    "SANDBOX",
                    "LIVE"
                  ]
                }
              },
              "X-Nigson-Carrier-Account-SHA256": {
                "description": "Actual immutable configured account identity, included in durable command hash; never a browser-selected account. ADR-016.",
                "schema": {
                  "type": "string",
                  "pattern": "^[a-f0-9]{64}$"
