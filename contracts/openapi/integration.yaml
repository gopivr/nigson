{
  "openapi": "3.1.0",
  "info": {
    "title": "Nigson private integration API",
    "version": "1.1.0"
  },
  "paths": {
    "/internal/v1/jobs": {
      "get": {
        "operationId": "API-140",
        "security": [
          {
            "workload": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "403": {
            "description": "Access denied",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "409": {
            "description": "Conflict",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "412": {
            "description": "Version mismatch",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "422": {
            "description": "Provider rule violation",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "500": {
            "description": "Safe internal error",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "503": {
            "description": "Provider unavailable or outcome unknown",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          }
        },
        "description": "Private SERVICE_COMMERCE jobs.read; no actor assertion, cookie or origin. Closed safe paginated views; no request body; unknown/repeated parameters denied.",
        "parameters": [
          {
            "name": "kind",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "SHEETS_SYNC",
                "LOGISTICS_CREATE",
                "PAYMENT_RECONCILE",
                "ASSET_SCAN",
                "REPORT_EXPORT"
              ]
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "PENDING",
                "CLAIMED",
                "SUCCEEDED",
                "FAILED",
                "UNKNOWN"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "nextAttemptAt,asc",
                "nextAttemptAt,desc",
                "id,asc",
                "id,desc"
              ],
              "default": "nextAttemptAt,asc"
            }
          }
        ]
      }
    },
    "/internal/v1/jobs/{id}/retry": {
      "post": {
        "operationId": "API-141",
        "security": [
          {
            "workload": [],
            "signedActor": []
          }
        ],
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JobDTO"
                }
              }
            },
            "headers": {
              "ETag": {
                "description": "Actual accepted job version",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "403": {
            "description": "Access denied",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "409": {
            "description": "Conflict",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "412": {
            "description": "Version mismatch",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "422": {
            "description": "Provider rule violation",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "500": {
            "description": "Safe internal error",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "503": {
            "description": "Provider unavailable or outcome unknown",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          }
        },
        "description": "Private SERVICE_COMMERCE jobs.retry_WITH_SIGNED_STAFF; current source OPERATIONS and recent MFA. FAILED only; UNKNOWN must reconcile and CLAIMED cannot be bypassed. Same command key replays actual acknowledgement without another queue transition; original business key and attempt count retained. No provider HTTP in command transaction.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\"(0|[1-9][0-9]{0,18})\"$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100
            }
          },
          {
            "name": "X-Correlation-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/JobRetry"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "JobDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "state",
          "attemptCount",
          "nextAttemptAt",
          "lastErrorCode"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING",
              "CLAIMED",
              "SUCCEEDED",
              "FAILED",
              "UNKNOWN"
            ]
          },
          "attemptCount": {
            "type": "integer",
            "minimum": 0
          },
          "nextAttemptAt": {
            "type": "string",
            "format": "date-time"
          },
          "lastErrorCode": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 60,
            "pattern": "^[A-Z][A-Z0-9_]{0,59}$"
          }
        }
      },
      "JobRetry": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "JobPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page",
          "size",
          "totalElements",
          "totalPages"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/JobDTO"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalElements": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      }
    },
    "securitySchemes": {
      "workload": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Exact registered Keycloak client/audience/scope; private ingress only"
      },
      "signedActor": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Nigson-Actor",
        "description": "ES256 assertion binds method/path/body/correlation, OPERATIONS and recent MFA"
      }
    }
  }
}
