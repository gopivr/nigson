        "description": "Private SERVICE_COMMERCE carrier.quote_WITH_SIGNED_ACTOR. Closed NG/NGN server address/packing only. Configured account/service/pickup and current approval; exact single ACCOUNT rate in NGN. No exchange conversion, route assumption or manual fallback. Actual OAuth/rate HTTP occurs outside local locks; commandId durably replays the original acknowledgement/audit. Returned rate expires within five minutes; commerce must revalidate the cart/address/packages before binding. This command never books or dispatches.",
        "parameters": [
          {
            "name": "X-Correlation-ID",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
