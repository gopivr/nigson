  "components": {
    "schemas": {
      "JobDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "state",
          "attemptCount",
          "nextAttemptAt",
          "lastErrorCode"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING",
              "CLAIMED",
              "SUCCEEDED",
              "FAILED",
              "UNKNOWN"
            ]
          },
          "attemptCount": {
            "type": "integer",
            "minimum": 0
          },
          "nextAttemptAt": {
            "type": "string",
            "format": "date-time"
          },
          "lastErrorCode": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 60,
            "pattern": "^[A-Z][A-Z0-9_]{0,59}$"
          }
        }
      },
      "JobRetry": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "JobPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page",
          "size",
          "totalElements",
          "totalPages"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/JobDTO"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalElements": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "CarrierAddress": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "recipient",
          "phone",
          "line1",
          "line2",
          "city",
          "region",
          "postalCode",
          "countryCode"
        ],
        "properties": {
          "recipient": {
            "type": "string",
            "minLength": 1,
            "maxLength": 160
          },
          "phone": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{7,14}$"
          },
          "line1": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "line2": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 200
          },
          "city": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "region": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "postalCode": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 24
          },
          "countryCode": {
            "const": "NG",
            "type": "string"
          }
        }
      },
      "CarrierPackage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "skuId",
          "quantity",
          "weightKg",
          "lengthCm",
          "widthCm",
          "heightCm"
        ],
        "properties": {
          "skuId": {
            "type": "string",
            "format": "uuid"
          },
          "quantity": {
            "type": "string",
