  "components": {
    "schemas": {
      "PhoneDestination": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "channel",
          "maskedAddress",
          "status",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "channel": {
            "enum": [
              "SMS",
              "WHATSAPP"
            ]
          },
          "maskedAddress": {
            "type": "string",
            "pattern": "^\\+234\\*{6}[0-9]{4}$"
          },
          "status": {
            "enum": [
              "PENDING",
              "ACTIVE",
              "UNSUBSCRIBED",
              "SUPPRESSED"
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "PhoneDestinationInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "channel",
          "address",
          "policyVersion",
          "consentedPurposes"
        ],
        "properties": {
          "channel": {
            "enum": [
              "SMS",
              "WHATSAPP"
            ]
          },
          "address": {
            "type": "string",
            "pattern": "^\\+234[1-9][0-9]{9}$"
          },
          "policyVersion": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,39}$"
          },
          "consentedPurposes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "enum": [
                "ORDER_UPDATES",
                "MARKETING",
                "CART_RECOVERY"
              ]
            }
          }
        }
      },
      "PhoneProof": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        }
      },
      "PhoneProofPrivate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "version"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "PhoneWithdrawal": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "PhoneVerificationJob": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "jobId"
        ],
        "properties": {
          "jobId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          }
        }
      },
      "PhoneSuppressionCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "destinationHash",
          "channel"
        ],
        "properties": {
          "destinationHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "channel": {
            "const": "WHATSAPP"
          }
        }
      },
      "PhoneSuppressionResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "suppressed"
        ],
        "properties": {
          "suppressed": {
            "type": "boolean"
          }
        }
      },
      "PhoneVerificationContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phone",
          "channel",
          "code",
          "expiresAt",
          "templateCode"
        ],
        "properties": {
          "phone": {
            "type": "string",
            "pattern": "^\\+234[1-9][0-9]{9}$"
          },
          "channel": {
            "enum": [
              "SMS",
              "WHATSAPP"
            ]
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "templateCode": {
            "const": "CONTACT_VERIFICATION"
          }
        }
      },
      "LeadMessagingContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phone",
          "channel",
          "destinationHash",
          "eligible",
          "basis",
          "approvedTemplateCodes"
        ],
        "properties": {
          "phone": {
            "type": "string",
            "pattern": "^\\+234[1-9][0-9]{9}$"
          },
          "channel": {
            "const": "WHATSAPP"
          },
          "destinationHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "eligible": {
            "const": true
          },
          "basis": {
            "enum": [
              "SIGNED_INBOUND_REQUEST",
              "VERIFIED_DESTINATION"
            ]
          },
          "approvedTemplateCodes": {
            "type": "array",
            "maxItems": 10,
            "uniqueItems": true,
            "items": {
              "enum": [
                "STAFF_LEAD_REPLY"
              ]
            }
          }
        }
      },
      "PhoneEligibilityInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "channel",
          "purpose"
        ],
        "properties": {
          "partyId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "destinationId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "channel": {
            "enum": [
              "SMS",
              "WHATSAPP"
            ]
          },
          "purpose": {
            "enum": [
              "ORDER_UPDATES",
              "MARKETING",
              "CART_RECOVERY"
            ]
          }
        },
        "anyOf": [
          {
            "required": [
              "partyId"
            ]
          },
          {
            "required": [
              "destinationId"
            ]
          }
        ]
      },
      "PhoneEligibility": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eligible",
          "reasonCode",
          "email",
          "phone",
          "destinationHash",
          "policyRevision"
        ],
        "properties": {
          "eligible": {
            "type": "boolean"
          },
          "reasonCode": {
            "enum": [
              "GRANTED",
              "SUPPRESSED",
              "CONSENT_NOT_GRANTED"
            ]
          },
          "email": {
            "type": "null"
          },
          "phone": {
            "type": [
              "string",
              "null"
            ]
          },
          "destinationHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "policyRevision": {
            "type": "string"
          }
        }
      },
      "PhoneSuppression": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "commandId",
          "destinationHash",
          "channel",
          "reason"
        ],
        "properties": {
          "commandId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "destinationHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "channel": {
            "enum": [
              "SMS",
              "WHATSAPP"
            ]
          },
          "reason": {
            "enum": [
              "HARD_BOUNCE",
              "COMPLAINT",
              "OPT_OUT"
            ]
          }
        }
      },
      "PhoneAcknowledged": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "acknowledged"
        ],
        "properties": {
          "acknowledged": {
            "type": "boolean"
          }
        }
      }
    },
    "securitySchemes": {
      "workload": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "https://configured-keycloak.invalid/protocol/openid-connect/token",
            "scopes": {
              "communication.create_WITH_SIGNED_CUSTOMER": "Exact commerce private phone operation",
              "communication.verify_WITH_SIGNED_CUSTOMER": "Exact commerce private phone operation",
              "communication.read_WITH_SIGNED_CUSTOMER": "Exact commerce private phone operation",
              "communication.withdraw_WITH_SIGNED_CUSTOMER": "Exact commerce private phone operation",
              "notification.read": "Original private verification context",
              "notification.read_WITH_SIGNED_ACTOR": "Lead reply context for a signed SALES actor",
              "consent.read": "Current phone eligibility",
              "consent.write": "Verified provider phone suppression"
            }
          }
        }
      },
      "signedActor": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Nigson-Actor"
      }
    }
  }
}
