      "get": {
        "operationId": "API-138",
        "description": "Exact nigson-commerce workload client and audit.read_WITH_SIGNED_ADMIN scope with signed ADMIN actor proof. The proof is issued by the Commerce BFF after current ADMIN authorization; organization-scoped actors are denied. Read only Experience.audit_record. Bound filters use resourceId, action and optional UTC from/to (when both are present, the positive interval is at most 366 days). Reject unknown/repeated parameters, request bodies, invalid ranges and non-allowlisted sorts. Stable ordering uses audit id as final tie-breaker. Pages are bounded to 100 rows. Persisted JSON is redacted again at read time. Response is no-store. This GET is append-only-safe and does not write audit, idempotency or outbox state; no retention/access policy is inferred.",
