            "format": "int64",
            "minimum": 1,
            "maximum": 10485760
          },
          "checksumSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "linkedResourceId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          }
        },
        "description": "IMAGE <=5MiB JPEG/PNG/WebP; BROCHURE <=10MiB PDF. SHIPPING_LABEL is generated by trusted carrier results only. linkedResourceId resolves an owned product/SKU; detached uploads are creator-only."
      },
      "FileUploadResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assetId",
          "uploadUrl",
          "requiredHeaders",
          "expiresAt"
        ],
        "properties": {
          "assetId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "uploadUrl": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://"
          },
          "requiredHeaders": {
            "type": "object",
            "maxProperties": 20,
            "additionalProperties": {
              "type": "string",
              "maxLength": 1000
            }
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "FileCompletion": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "checksumSha256"
        ],
        "properties": {
          "checksumSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "AssetDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "state",
          "purpose",
          "mimeType",
          "size",
          "checksum",
          "url",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "state": {
            "enum": [
              "UPLOADING",
              "QUARANTINED",
              "CLEAN",
              "PUBLISHED",
              "REJECTED"
            ]
          },
          "purpose": {
            "enum": [
              "IMAGE",
              "BROCHURE",
              "SHIPPING_LABEL"
            ]
          },
          "mimeType": {
            "type": "string",
            "maxLength": 100
          },
          "size": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "checksum": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "url": {
            "anyOf": [
              {
                "type": "string",
                "format": "uri",
                "pattern": "^https://"
              },
              {
                "type": "null"
              }
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "FileDownload": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "url",
          "expiresAt"
        ],
        "properties": {
          "url": {
            "type": "string",
            "format": "uri",
            "pattern": "^https://"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "FileScanResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "commandId",
          "checksumSha256",
          "result",
          "scannerVersion"
        ],
        "properties": {
          "commandId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "checksumSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "result": {
            "enum": [
              "CLEAN",
              "REJECTED"
            ]
          },
          "scannerVersion": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:+-]{0,99}$"
          },
          "reasonCode": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]{0,99}$"
          }
        }
      },
      "JobDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "state",
          "attemptCount",
          "nextAttemptAt",
          "lastErrorCode"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING",
              "CLAIMED",
              "SUCCEEDED",
              "FAILED",
              "UNKNOWN"
            ]
          },
          "attemptCount": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          },
          "nextAttemptAt": {
            "type": "string",
            "format": "date-time"
          },
          "lastErrorCode": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[A-Z][A-Z0-9_]{0,99}$"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "JobPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page",
          "size",
          "totalElements",
          "totalPages"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/JobDTO"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalElements": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "JobRetry": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "description": "Nonblank and no control/format characters. Never copied into audit or errors."
          }
        }
      }
    }
  }
}
