    "/api/v1/staff/users": {
      "get": {
        "operationId": "API-011",
        "description": "ADMIN only. Search mapped staff, including historical assignments. Reject unknown or repeated parameters. Default stable createdAt descending order. No request body.",
        "security": [
          {
            "bffSession": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200,
              "default": ""
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "createdAt,desc",
                "createdAt,asc",
                "displayName,asc",
                "displayName,desc",
                "email,asc",
                "email,desc"
              ],
              "default": "createdAt,desc"
