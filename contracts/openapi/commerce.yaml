{
  "openapi": "3.1.0",
  "info": {
    "title": "Nigson commerce implemented authorization contracts",
    "version": "1.1.0",
    "description": "Incremental implemented endpoints; pending roadmap APIs remain in docs/API_CONTRACT.md."
  },
  "paths": {
    "/api/v1/staff/users": {
      "get": {
        "operationId": "API-011",
        "description": "ADMIN only. Search mapped staff, including historical assignments. Reject unknown or repeated parameters. Default stable createdAt descending order. No request body.",
        "security": [
          {
            "bffSession": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200,
              "default": ""
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "createdAt,desc",
                "createdAt,asc",
                "displayName,asc",
                "displayName,desc",
                "email,asc",
                "email,desc"
              ],
              "default": "createdAt,desc"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StaffPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "403": {
            "description": "Access denied",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting or in-progress request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "412": {
            "description": "Version mismatch",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "422": {
            "description": "Last active administrator protection",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "500": {
            "description": "Safe internal error",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/staff/users/{id}/roles": {
      "put": {
        "operationId": "API-012",
        "description": "Current ADMIN and signed recent MFA within 15 minutes. Active mapped staff target; preserve last active ADMIN. StaffDTO version is the Party aggregate version. Audit changes, increment revision and revoke all target sessions in one transaction. Idempotency identity is actor party plus API-012; canonical input includes target, expected revision, roles and reason. Matching replay returns original response; conflicting input is 409; stale revision is 412. No-op preserves revision and sessions. Reason is validated but free text is redacted from audit under existing policy. No direct domain event.",
        "security": [
          {
            "bffSession": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\"(0|[1-9][0-9]{0,18})\"$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100,
              "pattern": "^[ -~]+$"
            }
          },
          {
            "name": "X-CSRF-TOKEN",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StaffDTO"
                }
              }
            },
            "headers": {
              "ETag": {
                "description": "Quoted aggregate revision",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "403": {
            "description": "Access denied",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting or in-progress request",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "412": {
            "description": "Version mismatch",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "422": {
            "description": "Last active administrator protection",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "415": {
            "description": "Unsupported content type",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          },
          "500": {
            "description": "Safe internal error",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../problem/problem.schema.json"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StaffRoleChange"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bffSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-nigson-session",
        "description": "Encrypted JDBC BFF session. Explicit insecure local profile uses nigson-local-session. Browser bearer tokens are denied by SEC-001."
      }
    },
    "schemas": {
      "Role": {
        "type": "string",
        "enum": [
          "ADMIN",
          "CONTENT_EDITOR",
          "CONTENT_PUBLISHER",
          "SALES",
          "OPERATIONS",
          "FINANCE",
          "ANALYST"
        ]
      },
      "StaffDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "displayName",
          "email",
          "roles",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "pattern": "^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$"
          },
          "displayName": {
            "type": "string",
            "maxLength": 160
          },
          "email": {
            "type": "string",
            "format": "email",
            "maxLength": 254
          },
          "roles": {
            "type": "array",
            "maxItems": 7,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/Role"
            }
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      },
      "StaffRoleChange": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "roles",
          "reason"
        ],
        "properties": {
          "roles": {
            "type": "array",
            "maxItems": 7,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/Role"
            }
          },
          "reason": {
            "type": "string",
            "minLength": 10,
            "maxLength": 500,
            "description": "At least 10 non-padding characters; no control characters."
          }
        }
      },
      "StaffPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page",
          "size",
          "totalElements",
          "totalPages"
        ],
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/StaffDTO"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 0
          },
          "size": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "totalElements": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "totalPages": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
        }
      }
    }
  }
}
