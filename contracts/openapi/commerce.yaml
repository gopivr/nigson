  "components": {
    "securitySchemes": {
      "bffSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-nigson-session",
        "description": "Encrypted JDBC BFF session. Explicit insecure local profile uses nigson-local-session. Browser bearer tokens are denied by SEC-001."
      },
      "integrationWorkload": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "/realms/nigson/protocol/openid-connect/token",
            "scopes": {
              "files.scan.write": "Integration-owned scan-result application",
              "notification.read": "Minimal order notification context",
              "notification.write": "Minimal job/state delivery accounting"
            }
          }
        },
        "description": "Private ingress, exact Keycloak issuer/audience/client/scope. No browser cookies or signed user actor."
      },
      "experienceWorkload": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "/realms/nigson/protocol/openid-connect/token",
            "scopes": {
              "purchase-proof.read": "Minimal owned settled-purchase boolean proof"
            }
          }
        },
        "description": "Private ingress, exact nigson-experience client/issuer/audience/scope. No browser cookie or signed actor."
      },
      "paystackSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Paystack-Signature",
        "description": "HMAC-SHA512 of exact raw bytes, verified before parsing. Independent provider verification authorizes financial state."
      },
      "paymentIntegrationWorkload": {
        "type": "oauth2",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "/realms/nigson/protocol/openid-connect/token",
            "scopes": {
              "payment.reconcile": "Commerce-owned independent verification"
            }
          }
        },
        "description": "Private ingress; exact nigson-integration client, issuer, audience and scope. No browser cookie or signed actor."
      }
    },
    "schemas": {
      "Role": {
        "type": "string",
        "enum": [
          "ADMIN",
          "CONTENT_EDITOR",
          "CONTENT_PUBLISHER",
          "SALES",
          "OPERATIONS",
          "FINANCE",
          "ANALYST"
        ]
      },
      "StaffDTO": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "displayName",
          "email",
          "roles",
