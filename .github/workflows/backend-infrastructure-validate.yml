name: Backend — Validate Infrastructure
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/terraform/aws/**'
      - 'infrastructure/docker/**'
      - 'services/**/Dockerfile'
      - 'scripts/infra/**'
      - '.github/workflows/backend-images-publish.yml'
      - '.github/workflows/backend-deploy.yml'
      - 'scripts/infra/prepare-first-account.py'
      - 'scripts/infra/tests/test_first_account.py'
      - 'scripts/infra/first-account-pipeline.py'
      - 'scripts/infra/deploy-first-account-frontend.py'
      - 'scripts/infra/tests/test_frontend_deployment.py'
      - 'scripts/infra/tests/verify_frontend_release_plan.py'
      - 'scripts/infra/tests/test_first_account_pipeline.py'
      - 'scripts/infra/tests/workflows-test.sh'
      - 'scripts/infra/tests/verify_log_group_moves.py'
      - 'scripts/infra/tests/test_log_group_moves.py'
      - '.github/workflows/backend-aws-infrastructure.yml'
      - '.github/workflows/backend-infrastructure-validate.yml'
      - 'scripts/security/check_source_secrets.py'
      - 'tests/security/test_source_secrets.py'
      - 'scripts/infra/tests/frontend-routing-test.cjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [bootstrap, first-account, modules/compute, modules/identity, modules/frontend, modules/storage, modules/secrets, modules/observability]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infrastructure/terraform/aws/${{ matrix.directory }}
      - name: Initialize using the same lock policy as the bootstrap pipeline
        env:
          TF_ROOT: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          lock_args=()
          if [[ "$TF_ROOT" == bootstrap || "$TF_ROOT" == first-account ]]; then
            lock_args+=(-lockfile=readonly)
          fi
          terraform -chdir="infrastructure/terraform/aws/$TF_ROOT" init -backend=false -input=false "${lock_args[@]}"
      - run: terraform -chdir=infrastructure/terraform/aws/${{ matrix.directory }} validate
      - if: matrix.directory != 'first-account'
        run: terraform -chdir=infrastructure/terraform/aws/${{ matrix.directory }} test
      - name: Test first-account composition and partial-apply state recovery
        if: matrix.directory == 'first-account'
        run: |
          mkdir -p .build/terraform-test
          result=.build/terraform-test/first-account.jsonl
          if ! terraform -chdir=infrastructure/terraform/aws/first-account test -verbose -json > "$result" 2>&1; then
            python3 scripts/infra/tests/verify_log_group_moves.py "$result"
            exit 1
          fi
          python3 scripts/infra/tests/verify_log_group_moves.py "$result"
          python3 scripts/infra/tests/verify_frontend_release_plan.py "$result"
          python3 -m unittest discover -s scripts/infra/tests -p test_log_group_moves.py -v
      - if: matrix.directory == 'bootstrap'
        run: python3 -m unittest discover -s scripts/infra/tests -p test_first_account.py -v
      - if: matrix.directory == 'bootstrap'
        run: python3 -m unittest discover -s scripts/infra/tests -p test_first_account_pipeline.py -v
      - if: matrix.directory == 'bootstrap'
        run: bash scripts/infra/tests/workflows-test.sh
      - if: matrix.directory == 'bootstrap'
        run: python3 -m unittest discover -s scripts/infra/tests -p test_frontend_deployment.py -v
      - name: Check CDN navigation and error routing
        if: matrix.directory == 'modules/frontend'
        run: node scripts/infra/tests/frontend-routing-test.cjs
      - name: Check tracked source credentials
        if: matrix.directory == 'bootstrap'
        run: |
          python3 scripts/security/check_source_secrets.py
          python3 -m unittest discover -s tests/security -p test_source_secrets.py -v

  offline-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Check formatting
        run: |
          terraform -chdir=infrastructure/terraform/aws/modules/network fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/compute fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/database fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/migrations fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/storage fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/secrets fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/messaging fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/observability fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/identity fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/modules/private-trust fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/environments/stage fmt -check -recursive
          terraform -chdir=infrastructure/terraform/aws/environments/prod fmt -check -recursive
      - name: Initialize without a backend
        run: |
          terraform -chdir=infrastructure/terraform/aws/modules/network init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/compute init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/database init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/migrations init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/storage init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/secrets init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/messaging init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/observability init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/identity init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/modules/private-trust init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/environments/stage init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/aws/environments/prod init -backend=false -input=false
      - name: Validate configuration
        run: |
          terraform -chdir=infrastructure/terraform/aws/modules/network validate
          terraform -chdir=infrastructure/terraform/aws/modules/compute validate
          terraform -chdir=infrastructure/terraform/aws/modules/database validate
          terraform -chdir=infrastructure/terraform/aws/modules/migrations validate
          terraform -chdir=infrastructure/terraform/aws/modules/storage validate
          terraform -chdir=infrastructure/terraform/aws/modules/secrets validate
          terraform -chdir=infrastructure/terraform/aws/modules/messaging validate
          terraform -chdir=infrastructure/terraform/aws/modules/observability validate
          terraform -chdir=infrastructure/terraform/aws/modules/identity validate
          terraform -chdir=infrastructure/terraform/aws/modules/private-trust validate
          terraform -chdir=infrastructure/terraform/aws/environments/stage validate
          terraform -chdir=infrastructure/terraform/aws/environments/prod validate
      - name: Test private network topology
        run: terraform -chdir=infrastructure/terraform/aws/modules/network test
      - name: Test private ECS and ALB boundaries
        run: terraform -chdir=infrastructure/terraform/aws/modules/compute test
      - name: Test private database boundaries
        run: terraform -chdir=infrastructure/terraform/aws/modules/database test
      - name: Test one-shot migration tasks
        run: terraform -chdir=infrastructure/terraform/aws/modules/migrations test
      - name: Test SNS and SQS ownership boundaries
        run: terraform -chdir=infrastructure/terraform/aws/modules/messaging test
      - name: Test S3 storage and access controls
        run: terraform -chdir=infrastructure/terraform/aws/modules/storage test
      - name: Test KMS and secret phase gates
        run: terraform -chdir=infrastructure/terraform/aws/modules/secrets test
      - name: Test identity network boundaries
        run: terraform -chdir=infrastructure/terraform/aws/modules/identity test
      - name: Test observability phase gates
        run: terraform -chdir=infrastructure/terraform/aws/modules/observability test
      - name: Test private service trust
        run: terraform -chdir=infrastructure/terraform/aws/modules/private-trust test
      - name: Test immutable artifact publication gates
        run: bash scripts/infra/tests/publish-images-test.sh
      - name: Test pinned production container inputs
        run: bash scripts/infra/tests/dockerfiles-test.sh
      - name: Test workflow permissions and environment boundaries
        run: bash scripts/infra/tests/workflows-test.sh
      - name: Test production migration destination guards
        run: bash scripts/infra/tests/migration-target-policy-test.sh
      - name: Test one-shot migration launch and no-retry behavior
        run: bash scripts/infra/tests/run-owner-migration-test.sh
      - name: Test stage and production deployment migration gate and rollback behavior
        run: bash scripts/infra/tests/deploy-environment-test.sh
      - name: Test stage and production private and public smoke probes
        run: bash scripts/infra/tests/smoke-environment-test.sh
      - name: Test isolated RDS restore verifier
        run: bash scripts/infra/tests/verify-rds-restore-test.sh
