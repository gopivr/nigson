name: validate first AWS account configuration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/terraform/aws/**'
      - 'scripts/infra/prepare-first-account.py'
      - 'scripts/infra/tests/test_first_account.py'
      - 'scripts/infra/first-account-pipeline.py'
      - 'scripts/infra/tests/test_first_account_pipeline.py'
      - 'scripts/infra/tests/workflows-test.sh'
      - 'scripts/infra/tests/verify_log_group_moves.py'
      - 'scripts/infra/tests/test_log_group_moves.py'
      - '.github/workflows/aws-first-account-bootstrap.yml'
      - '.github/workflows/aws-first-account-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [bootstrap, first-account, modules/compute, modules/identity, modules/frontend, modules/storage, modules/secrets, modules/observability]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infrastructure/terraform/aws/${{ matrix.directory }}
      - name: Initialize using the same lock policy as the bootstrap pipeline
        env:
          TF_ROOT: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          lock_args=()
          if [[ "$TF_ROOT" == bootstrap || "$TF_ROOT" == first-account ]]; then
            lock_args+=(-lockfile=readonly)
          fi
          terraform -chdir="infrastructure/terraform/aws/$TF_ROOT" init -backend=false -input=false "${lock_args[@]}"
      - run: terraform -chdir=infrastructure/terraform/aws/${{ matrix.directory }} validate
      - if: matrix.directory != 'first-account'
        run: terraform -chdir=infrastructure/terraform/aws/${{ matrix.directory }} test
      - name: Test first-account composition and partial-apply state recovery
        if: matrix.directory == 'first-account'
        run: |
          mkdir -p .build/terraform-test
          result=.build/terraform-test/first-account.jsonl
          if ! terraform -chdir=infrastructure/terraform/aws/first-account test -verbose -json > "$result" 2>&1; then
            python3 scripts/infra/tests/verify_log_group_moves.py "$result"
            exit 1
          fi
          python3 scripts/infra/tests/verify_log_group_moves.py "$result"
          python3 -m unittest discover -s scripts/infra/tests -p test_log_group_moves.py -v
      - if: matrix.directory == 'bootstrap'
        run: python3 -m unittest discover -s scripts/infra/tests -p test_first_account.py -v
      - if: matrix.directory == 'bootstrap'
        run: python3 -m unittest discover -s scripts/infra/tests -p test_first_account_pipeline.py -v
      - if: matrix.directory == 'bootstrap'
        run: bash scripts/infra/tests/workflows-test.sh
