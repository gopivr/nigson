name: OVH Terraform validation
on:
  pull_request:
    paths:
      - "infrastructure/terraform/ovh/**"
      - "infrastructure/terraform/aws/database/**"
      - "scripts/infra/validate-terraform.sh"
      - ".github/workflows/infra-ovh-validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - run: bash scripts/infra/validate-terraform.sh ovh
