name: Backend — AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bootstrap/plan/apply foundation, or runtime-plan/runtime-apply for first deployment
        required: true
        type: choice
        options: [bootstrap, plan, apply, runtime-plan, runtime-apply]
        default: bootstrap

permissions:
  contents: read

concurrency:
  group: nigson-stage-deployment
  cancel-in-progress: false

jobs:
  first-account:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: stage
    permissions:
      contents: read
      actions: read
    outputs:
      architecture: ${{ steps.foundation.outputs.architecture }}
      product_phase: ${{ steps.foundation.outputs.product_phase }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_OIDC_PROVIDER_ARN: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      BOOTSTRAP_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate required credential inputs
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ "$AWS_EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'Set AWS_ACCOUNT_ID to your twelve-digit account ID.' >&2; exit 1; }
          [[ -n "$ACCESS_KEY_ID" && -n "$SECRET_ACCESS_KEY" ]] || { echo 'Set both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repository secrets.' >&2; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - id: release
        name: Select latest staging release for first runtime setup
        if: startsWith(inputs.action, 'runtime-')
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/infra/select-backend-release.py stage
      - name: Download the selected immutable runtime receipt
        if: startsWith(inputs.action, 'runtime-')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          merge-multiple: true
          path: .build/selected-backend-release
      - id: foundation
        name: Bootstrap or provision the first-account platform
        if: ${{ !startsWith(inputs.action, 'runtime-') }}
        run: |
          set -euo pipefail
          python3 scripts/infra/first-account-pipeline.py "$BOOTSTRAP_ACTION"
          if [[ "$BOOTSTRAP_ACTION" == bootstrap ]]; then
            python3 scripts/infra/first-account-pipeline.py apply
          fi
      - name: Provision tasks, migrate, bootstrap identity and activate services
        if: startsWith(inputs.action, 'runtime-')
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.release.outputs.source_run_attempt }}
        run: python3 scripts/infra/setup-first-account-runtime.py "$BOOTSTRAP_ACTION" --receipt .build/selected-backend-release/release.json
      - name: Retain sanitized first-deployment outcome
        if: always() && startsWith(inputs.action, 'runtime-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-runtime-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/backend-deploy/deployment.json
          if-no-files-found: ignore
          retention-days: 30
  publish-images:
    needs: first-account
    if: inputs.action == 'bootstrap'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-images-publish.yml
    with:
      environment: stage
      architecture: ${{ needs.first-account.outputs.architecture }}
      product_phase: ${{ needs.first-account.outputs.product_phase }}
    secrets: inherit
