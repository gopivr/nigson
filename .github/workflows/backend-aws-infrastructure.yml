name: Backend — AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bootstrap state and DNS, plan the platform, or apply staging infrastructure
        required: true
        type: choice
        options: [bootstrap, plan, apply]
        default: bootstrap

permissions:
  contents: read

concurrency:
  group: nigson-infrastructure-stage
  cancel-in-progress: false

jobs:
  first-account:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: stage
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      BOOTSTRAP_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate required credential inputs
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ "$AWS_EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'Set AWS_ACCOUNT_ID to your twelve-digit account ID.' >&2; exit 1; }
          [[ -n "$ACCESS_KEY_ID" && -n "$SECRET_ACCESS_KEY" ]] || { echo 'Set both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repository secrets.' >&2; exit 1; }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Bootstrap or provision the first-account platform
        run: python3 scripts/infra/first-account-pipeline.py "$BOOTSTRAP_ACTION"
