# Real PandaGo HTTP adapter. Local TEST uses stage; production requires LIVE.
services:
  commerce:
    environment:
      NIGSON_SECURITY_ENABLED: "true"
      NIGSON_CARRIER_QUOTES_ENABLED: "true"
      NIGSON_CARRIER_PROVIDER: PANDAGO
      NIGSON_CARRIER_ACCOUNT_FINGERPRINT: ${NIGSON_PANDAGO_ACCOUNT_FINGERPRINT:?Set the verified PandaGo account fingerprint}
      NIGSON_FULFILLMENT_ENABLED: "true"
      NIGSON_FULFILLMENT_MODE: ${NIGSON_FULFILLMENT_MODE:-LIVE}
      NIGSON_FULFILLMENT_APPROVAL: ${NIGSON_PANDAGO_APPROVAL:?Set the approved PandaGo qualification reference}
      NIGSON_FULFILLMENT_APPROVAL_UNTIL: ${NIGSON_PANDAGO_APPROVAL_UNTIL:?Set the approved PandaGo live qualification expiry}
      NIGSON_PRICING_CHECKOUT_ENABLED: "true"
      NIGSON_PRICING_PROVIDER_MODE: ${NIGSON_PRICING_PROVIDER_MODE:-LIVE}
      NIGSON_PRICING_PAYMENT_APPROVAL: ${NIGSON_PAYSTACK_APPROVAL:?Set the approved Paystack live qualification reference}
      NIGSON_PRICING_CARRIER_APPROVAL: ${NIGSON_PANDAGO_APPROVAL:?Set the approved PandaGo qualification reference}
      NIGSON_PRICING_PROVIDER_APPROVAL_UNTIL: ${NIGSON_PANDAGO_APPROVAL_UNTIL:?Set the approved live qualification expiry}
      NIGSON_ORDER_CHECKOUT_ENABLED: "false"
  integration:
    environment:
      NIGSON_SECURITY_ENABLED: "true"
      NIGSON_PANDAGO_ENABLED: "true"
      NIGSON_PANDAGO_APPROVAL: ${NIGSON_PANDAGO_APPROVAL:?Set the approved PandaGo qualification reference}
      NIGSON_PANDAGO_APPROVAL_UNTIL: ${NIGSON_PANDAGO_APPROVAL_UNTIL:?Set the approved PandaGo live qualification expiry}
      PANDAGO_MODE: ${PANDAGO_MODE:-LIVE}
      PANDAGO_BASE_URL: ${PANDAGO_BASE_URL:-https://ondemand-api-glovoapp.deliveryhero.io}
      PANDAGO_AUTH_BASE_URL: ${PANDAGO_AUTH_BASE_URL:-https://sts.deliveryhero.io}
      PANDAGO_CLIENT_ID: ${PANDAGO_CLIENT_ID:?Missing Pandago client ID}
      PANDAGO_KEY_ID: ${PANDAGO_KEY_ID:?Missing Pandago key ID}
      PANDAGO_SCOPE: ${PANDAGO_SCOPE:?Missing Pandago scope}
      PANDAGO_CLIENT_VENDOR_ID: ${PANDAGO_CLIENT_VENDOR_ID:?Missing outlet ID}
      PANDAGO_PRIVATE_KEY_FILE: /run/secrets/pandago_private_key
    secrets:
      - pandago_private_key
secrets:
  pandago_private_key:
    file: ${PANDAGO_PRIVATE_KEY_FILE:?Set local private-key file path}
